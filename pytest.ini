[pytest]
testpaths = tests
markers =
    lookahead: planted look-ahead bug demos. These RUN BY DEFAULT -- they assert a
        guard raises on a specific planted mutation, which is what a regression test
        is, and they cost 0.14s combined. Three vacuous guards have been found in
        this project, so a test proving a guard has teeth is the one that must not
        be allowed to decay. The marker is kept so `-m lookahead` can still select
        just these three.
